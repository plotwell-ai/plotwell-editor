<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Email Change - plotwell</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8fafc;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        .wrapper {
            padding: 40px 20px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .content {
            padding: 40px 32px;
        }
        .brand {
            font-size: 15px;
            font-weight: 600;
            color: #d97706;
            letter-spacing: -0.01em;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-icon {
            width: 24px;
            height: 24px;
        }
        .title {
            font-size: 20px;
            font-weight: 600;
            color: #0f172a;
            margin: 0 0 8px 0;
            letter-spacing: -0.02em;
        }
        .subtitle {
            font-size: 14px;
            color: #64748b;
            margin: 0 0 24px 0;
        }
        .email-badge {
            display: inline-block;
            background-color: #fef3c7;
            color: #92400e;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
        }
        .info-section {
            background-color: #f8fafc;
            border-left: 3px solid #d97706;
            padding: 12px 16px;
            margin: 20px 0;
            border-radius: 0 4px 4px 0;
        }
        .info-section p {
            margin: 0;
            color: #475569;
            font-size: 14px;
        }
        .button-container {
            margin: 28px 0;
        }
        .cta-button {
            display: block;
            background-color: #d97706;
            color: #ffffff !important;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }
        .meta {
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
        }
        .footer {
            padding: 20px 32px;
            border-top: 1px solid #f1f5f9;
        }
        .footer p {
            margin: 0;
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="content">
                <div class="brand">
                    <svg class="brand-icon" viewBox="0 0 100 100" role="img" aria-label="plotwell">
                        <defs>
                            <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#f59e0b"/>
                                <stop offset="100%" style="stop-color:#d97706"/>
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="42" fill="url(#logo-grad)"/>
                        <g fill="white">
                            <rect x="25" y="20" width="50" height="6" rx="3"/>
                            <rect x="30" y="30" width="40" height="6" rx="3"/>
                            <rect x="20" y="40" width="60" height="6" rx="3"/>
                            <rect x="35" y="50" width="30" height="6" rx="3"/>
                            <rect x="15" y="60" width="70" height="6" rx="3"/>
                            <rect x="40" y="70" width="20" height="6" rx="3"/>
                        </g>
                    </svg>
                    plotwell
                </div>

                <h1 class="title">Confirm your new email</h1>
                <p class="subtitle">
                    You requested to change your email to
                    <span class="email-badge">{{ .Email }}</span>
                </p>

                <div class="info-section">
                    <p>Click the button below to confirm this change.</p>
                </div>

                <div class="button-container">
                    <a href="{{ .ConfirmationURL }}" class="cta-button">Confirm Email Change</a>
                </div>

                <p class="meta">Link expires in 24 hours</p>
            </div>

            <div class="footer">
                <p>If you didn't request this, please contact support immediately.</p>
            </div>
        </div>
    </div>
</body>
</html>
